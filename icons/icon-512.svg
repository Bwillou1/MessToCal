<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b57d0"/>
      <stop offset="50%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#6750a4"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006494"/>
      <stop offset="100%" stop-color="#00a896"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)"/>

  <!-- Main Calendar Card with shadow -->
  <g filter="url(#shadow)">
    <rect x="96" y="110" width="320" height="300" rx="36" fill="#ffffff"/>
    <path d="M 96 146 Q 96 110 132 110 L 380 110 Q 416 110 416 146 L 416 185 L 96 185 Z" fill="#d3e3fd"/>
    
    <!-- Calendar Binders -->
    <rect x="160" y="86" width="24" height="48" rx="12" fill="#0b57d0"/>
    <rect x="328" y="86" width="24" height="48" rx="12" fill="#0b57d0"/>

    <!-- Calendar Grid lines -->
    <circle cx="160" cy="245" r="14" fill="#0b57d0"/>
    <circle cx="224" cy="245" r="14" fill="#d3e3fd"/>
    <circle cx="288" cy="245" r="14" fill="#d3e3fd"/>
    <circle cx="352" cy="245" r="14" fill="#d3e3fd"/>
    
    <circle cx="160" cy="305" r="14" fill="#d3e3fd"/>
    <circle cx="224" cy="305" r="14" fill="#0b57d0"/>
    <circle cx="288" cy="305" r="14" fill="#00a896"/>
    <circle cx="352" cy="305" r="14" fill="#d3e3fd"/>

    <circle cx="160" cy="365" r="14" fill="#d3e3fd"/>
    <circle cx="224" cy="365" r="14" fill="#d3e3fd"/>
    <circle cx="288" cy="365" r="14" fill="#d3e3fd"/>
    <circle cx="352" cy="365" r="14" fill="#6750a4"/>
  </g>

  <!-- Messenger style speech bubble badge -->
  <g transform="translate(290, 270)" filter="url(#shadow)">
    <circle cx="95" cy="95" r="85" fill="url(#bubbleGrad)"/>
    <path d="M 130 170 L 160 195 L 148 160 Z" fill="url(#bubbleGrad)"/>
    <!-- Lightning / Sparkle / Check -->
    <path d="M 95 45 L 65 105 L 90 105 L 85 145 L 125 85 L 100 85 Z" fill="#ffffff"/>
  </g>
</svg>
